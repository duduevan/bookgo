name: Deploy para produção (FTPS)

# Disparo manual apenas. Enquanto não validarmos o primeiro envio real,
# nenhum push publica automaticamente.
#
# O GitHub só oferece "Run workflow" quando este arquivo já existe na branch
# padrão (main). Numa branch de feature o workflow não aparece em Actions —
# faça o merge antes de tentar o primeiro dry-run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular o envio sem alterar o servidor'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar dist/ no cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Falha antes de qualquer conexão se a configuração estiver incompleta.
      # Nenhum valor de usuário ou senha é impresso — apenas se existe ou não.
      - name: Validar configuração de deploy
        env:
          FTP_SERVER: ${{ vars.BOOKGO_FTP_SERVER }}
          FTP_PATH: ${{ vars.BOOKGO_FTP_PATH }}
          FTP_USERNAME: ${{ secrets.BOOKGO_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BOOKGO_FTP_PASSWORD }}
        run: |
          set -u
          falhou=0

          exigir() {
            if [ -z "${2:-}" ]; then
              echo "::error::$1 não está definido."
              falhou=1
            else
              echo "$1: definido"
            fi
          }

          exigir BOOKGO_FTP_SERVER "$FTP_SERVER"
          exigir BOOKGO_FTP_PATH "$FTP_PATH"
          exigir BOOKGO_FTP_USERNAME "$FTP_USERNAME"
          exigir BOOKGO_FTP_PASSWORD "$FTP_PASSWORD"

          # O FTP aponta direto para o document root do BookGo.
          if [ "$FTP_PATH" != "./" ]; then
            echo "::error::BOOKGO_FTP_PATH deve ser './' neste projeto (recebido: '$FTP_PATH')."
            falhou=1
          fi

          if [ "$falhou" -ne 0 ]; then
            echo "::error::Configuração inválida. Nenhuma conexão FTP foi tentada."
            exit 1
          fi

          echo "Configuração validada."

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      # O deploy só pode acontecer com um build válido em dist/.
      - name: Conferir dist/
        run: |
          test -d dist || { echo "::error::dist/ não foi gerado."; exit 1; }
          test -f dist/index.html || { echo "::error::dist/index.html ausente."; exit 1; }
          test -f dist/.htaccess || echo "::warning::dist/.htaccess ausente."
          echo "Arquivos a enviar: $(find dist -type f | wc -l)"

      # Credencial da Meta Conversions API.
      #
      # Escrita depois do build e só aqui: o token vive no GitHub Secret,
      # nunca no repositório e nunca no JavaScript da página. O arquivo sai
      # junto com o dist/ e o Apache recusa servi-lo (regra <Files> em
      # public/.htaccess). Quem o lê é o retransmissor em api/meta-capi.php.
      #
      # Sem o segredo configurado, nenhum arquivo é escrito: o endpoint
      # responde 503 e nenhum evento server-side sai. É o modo de falhar
      # correto — a medição para, a página continua.
      #
      # Nenhum comando abaixo imprime o valor. O `printf` escreve direto no
      # arquivo, e o `set -u` não expande segredo em log.
      - name: Gravar credencial da Conversions API
        if: ${{ !inputs.dry_run }}
        env:
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
        run: |
          set -u
          if [ -z "${META_CAPI_ACCESS_TOKEN:-}" ]; then
            echo "::warning::META_CAPI_ACCESS_TOKEN não está definido. A Conversions API fica desligada e o endpoint responderá 503."
            exit 0
          fi
          mkdir -p dist/api
          # O token entra em base64 para que nenhum caractere dele possa
          # escapar da string PHP: o alfabeto base64 não tem aspa, cifrão
          # nem barra invertida. Não é cifra, é só quoting seguro.
          codificado="$(printf '%s' "$META_CAPI_ACCESS_TOKEN" | base64 -w0)"
          printf '<?php return ["meta_capi_access_token" => base64_decode("%s")];\n' \
            "$codificado" > dist/api/credenciais.php
          chmod 600 dist/api/credenciais.php
          echo "Credencial da Conversions API gravada ($(wc -c < dist/api/credenciais.php) bytes)."

      # Rede de segurança: o token não pode ter vazado para nenhum arquivo
      # que o navegador baixa. Se vazou, o deploy para antes do envio.
      #
      # A busca não imprime o valor; em caso de achado sai só o caminho.
      - name: Conferir que o token não chegou ao conteúdo público
        if: ${{ !inputs.dry_run }}
        env:
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
        run: |
          set -u
          [ -z "${META_CAPI_ACCESS_TOKEN:-}" ] && exit 0
          achados=$(grep -rlF -e "$META_CAPI_ACCESS_TOKEN" dist \
            --exclude=credenciais.php 2>/dev/null || true)
          if [ -n "$achados" ]; then
            echo "::error::O token da Conversions API apareceu em arquivo publicável:"
            echo "$achados"
            exit 1
          fi
          echo "Token ausente de todo o conteúdo público."

      - name: Enviar via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.BOOKGO_FTP_SERVER }}
          username: ${{ secrets.BOOKGO_FTP_USERNAME }}
          password: ${{ secrets.BOOKGO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./dist/
          server-dir: ${{ vars.BOOKGO_FTP_PATH }}
          dangerous-clean-slate: false
          dry-run: ${{ inputs.dry_run }}
          log-level: ${{ inputs.dry_run && 'verbose' || 'standard' }}

      - name: Resumo
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "### Dry-run concluído" >> "$GITHUB_STEP_SUMMARY"
            echo "Nenhum arquivo foi alterado no servidor." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deploy concluído" >> "$GITHUB_STEP_SUMMARY"
            echo "Conteúdo de dist/ publicado no document root." >> "$GITHUB_STEP_SUMMARY"
          fi
