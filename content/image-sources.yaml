  # Três slots seguem sem imagem, e é de propósito.
  #
  # Segunda rodada de descarte nos mesmos lugares, agora por direção visual e
  # não por texto embutido: a segunda foto do cardápio semanal era retrato
  # posado sorrindo para a câmera com o celular na mão; a da mesa de casa era
  # um almoço social servindo vinho, e o trecho fala da refeição simples de
  # uma quarta-feira; a da semana que muda era cozinha branca de catálogo com
  # alguém no celular, sem cozinhar.
  #
  # Artigo com uma imagem certa é melhor do que artigo com duas, sendo uma
  # delas de banco de imagens. Os slots ficam abertos: declarar a origem aqui
  # basta para o texto voltar a ter a segunda foto, sem tocar no MDX.
