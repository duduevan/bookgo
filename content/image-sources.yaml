# ─────────────────────────────────────────────────────────────
#  Origem das imagens do site
#
#  Guarda a **identidade durável** de cada imagem: provedor, id do asset,
#  licença, autor e página de origem. `npm run images:fetch` resolve isso em
#  bytes, corta, converte para WebP e grava no destino. O mesmo script roda
#  no workflow "Materializar imagens declaradas".
#
#  URL ASSINADA NÃO ENTRA AQUI. Os links de download do Freepik e do
#  Magnific carregam token com expiração — persistir um deles seria guardar
#  credencial temporária num arquivo versionado, e o manifesto quebraria
#  sozinho quando o token vencesse.
#
#  Como o script resolve os bytes, nesta ordem:
#    1. variável de ambiente `IMAGE_URL_<assetId>`, se existir — é assim que
#       uma URL assinada de alta resolução chega ao runner sem ser
#       versionada;
#    2. `previewPath`, o caminho público do CDN, sem token e estável.
#
#  Por que este arquivo existe: o ambiente onde o conteúdo é editado tem
#  bloqueio de egress para os CDNs do Magnific e do Freepik. Escolher e
#  declarar acontecem lá; buscar os bytes acontece onde a rede permite.
# ─────────────────────────────────────────────────────────────

