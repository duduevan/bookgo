        - paginas/piquenique.webp
    - number: 8
      title: Fantasia e personagens mágicos
      icon: star
      blurb: Unicórnio, fada e dragão, para quem gosta de inventar história.
      objective: "Fadinha, poção mágica, coruja, gnomo, unicórnio, dragãozinho, sereia, aprendiz de mago, castelo e o baú do tesouro."
