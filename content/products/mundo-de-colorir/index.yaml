# ── FAQ ──────────────────────────────────────────────────────
faq:
  title: Perguntas frequentes
  items:
    - q: É material físico? Chega em casa?
      a: Não. É digital, para baixar e imprimir em casa. É isso que permite reimprimir o mesmo desenho sem custo novo.
    - q: Como eu recebo?
      a: O acesso é liberado após a aprovação do pagamento, e o arquivo fica disponível na área de membros para baixar quando quiser.
    - q: Preciso de impressora especial?
      a: Não. Foi feito para impressora doméstica comum, em A4, com fundo branco e sem área preta grande.
    - q: Posso imprimir mais de uma vez?
      a: Pode, sem limite, para as crianças da sua casa ou da sua turma.
    - q: Que papel usar?
      a: Papel comum resolve. Um pouco mais grosso segura melhor a canetinha, se a criança usar.
    - q: Para qual idade foi pensado?
      a: Aproximadamente 4 a 8 anos. Cada tema tem páginas simples e páginas mais cheias, então acompanha a criança por um bom tempo.
    - q: Dá para usar no celular ou tablet?
      a: Dá para abrir e ver o PDF em qualquer aparelho, mas o material foi feito para ser impresso e colorido no papel.
    - q: Tem personagem de desenho animado?
      a: Não. Toda a arte é original e foi desenhada para esta coleção.

