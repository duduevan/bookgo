# ── Como funciona: quatro passos ─────────────────────────────
howItWorks:
  title: Do clique ao lápis na mão
  intro: Não tem nada para montar, recortar antes ou combinar. São quatro passos, e o terceiro é o único que exige você.
  steps:
    - title: Você compra
      text: Pagamento único, sem mensalidade e sem renovação. O acesso é liberado após a aprovação do pagamento.
    - title: Você baixa o arquivo
      text: Um PDF só, com as 80 páginas. Guarde no computador ou no celular, porque ele é seu.
    - title: Você escolhe e imprime
      text: Abra o índice, escolha o tema, imprima a página em A4 na opção tamanho real. Papel comum funciona.
    - title: A criança colore
      text: Entregue os lápis e pronto. Quando a folha acabar, imprima de novo, sem custo nenhum.

# ── Conteúdo: os oito temas ──────────────────────────────────
contents:
  title: Os oito temas
  intro: São dez desenhos por tema, do mais simples ao mais cheio. Em qualquer tema que a criança escolher, existem páginas do tamanho dela.
  modules:
    - number: 1
      title: Animais fofos
      objective: "Gatinho com o novelo, coelho com a cenoura, ursinho e o pote de mel, pinguim de cachecol, panda, raposinha dormindo, preguiça no galho, elefantinho na poça e a família de patinhos."
    - number: 2
      title: Dinossauros
      objective: "Bebê saindo do ovo, tiranossauro sorridente, tricerátops, anquilossauro, estegossauro com borboletas nas placas, brontossauro alcançando as folhas altas, pterossauro planando e o vale com o vulcão ao fundo."
    - number: 3
      title: Fundo do mar
      objective: "Peixinho entre bolhas, estrela-do-mar, caranguejo, cavalo-marinho, tartaruga, polvo acenando, golfinho saltando, água-viva, baleia com o esguicho e o passeio pelo recife."
    - number: 4
      title: Espaço
      objective: "Foguete decolando, lua sorridente, planeta com anéis, alienígena simpático, astronauta flutuando, nave com janelinha, a bandeira na lua, cometa, a criança no telescópio e o sistema solar."
    - number: 5
      title: Veículos e aventuras
      objective: "Carrinho de corrida, balão de ar quente, bicicleta com cestinha, barco a vela, caminhão de bombeiros, avião entre as nuvens, trator, ônibus escolar, escavadeira e o trem da ponte."
    - number: 6
      title: Jardim e natureza
      objective: "Girassol, joaninha na folha, cogumelos, regador, borboleta na flor, abelhinha e a colmeia, passarinho no ninho, árvore com balanço, arco-íris e a horta."
    - number: 7
      title: Comidinhas divertidas
      objective: "Cupcake sorridente, sorvete de casquinha, rosquinha com cobertura, fatia de pizza, as frutinhas amigas, hambúrguer, chocolate quente, pipoca, bolo de aniversário e a mesa de piquenique."
    - number: 8
      title: Fantasia e personagens mágicos
      objective: "Fadinha, poção mágica, coruja da noite, gnomo do jardim, unicórnio, dragãozinho, sereia na pedra, aprendiz de mago, castelo e o baú do tesouro."

