# ── Avaliações ───────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────
#  AS CINCO MENSAGENS SÃO REAIS. UMA FRASE FOI CORTADA.
#
#  Renata  "Comprei na hora do almoço e recebi o acesso no e-mail no
#          mesmo minuto." Quem libera o acesso é a plataforma, e esse
#          prazo não é nosso: a página inteira diz "acesso liberado após
#          a aprovação do pagamento", e publicar "no mesmo minuto" seria
#          prometer em nome de terceiro. O resto da mensagem dela está
#          literal.
#
#  As outras quatro entraram inteiras: tudo o que elas afirmam sobre o
#  material é verdade, do traço grosso com áreas grandes ao fundo branco
#  que rende tinta, das divisórias por tema à pizza e ao sorvete
#  sorridentes, que são mesmo dois dos dez desenhos de comidinhas.
#
#  Juliana e Carolina receberam reação da equipe (emoji), e não resposta
#  escrita. O aparelho delas mostra só a mensagem: resposta que não
#  existiu não se inventa.
#
#  O que veio como "⭐⭐⭐⭐⭐" não entra: o formato da BookGo não tem
#  estrela, e nenhum aggregateRating é gerado por existir esta seção.
# ─────────────────────────────────────────────────────────────
