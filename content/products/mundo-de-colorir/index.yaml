# ── FAQ ──────────────────────────────────────────────────────
faq:
  title: Perguntas frequentes
  items:
    - q: O que eu recebo exatamente?
      a: Um arquivo em PDF com 80 páginas para colorir, organizadas em 8 temas, mais a capa, o índice, a página "este livro pertence a", as folhas de abertura de cada tema e uma folha curta de instruções.
    - q: É material físico? Chega em casa?
      a: Não. É digital, para você baixar e imprimir em casa quantas vezes quiser. É isso que permite reimprimir o mesmo desenho sem custo novo.
    - q: Preciso de impressora especial?
      a: Não. Foi feito para impressora doméstica comum, em papel A4, com fundo branco e sem área preta grande. Papel comum funciona bem, e papel um pouco mais grosso segura melhor a canetinha.
    - q: Posso imprimir mais de uma vez?
      a: Pode, sem limite, para as crianças da sua casa ou da sua turma.
    - q: Para que idade é?
      a: Aproximadamente 4 a 8 anos. Cada tema tem páginas mais simples e páginas mais cheias, então a faixa é larga de propósito e o material acompanha a criança por um bom tempo.
    - q: Tem personagem de desenho animado?
      a: Não. Toda a arte é original e foi desenhada para esta coleção.
    - q: Como eu recebo o acesso?
      a: O acesso é liberado após a aprovação do pagamento, e o arquivo fica disponível para baixar na área de membros. De lá você pode baixar de novo sempre que precisar.
    - q: Posso usar na escola ou no meu espaço infantil?
      a: Para imprimir e usar com as crianças que você atende, sim. Revender o arquivo, distribuí-lo ou publicá-lo, não.

