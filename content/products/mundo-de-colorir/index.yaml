# ── Situações de uso ─────────────────────────────────────────
# Benefício responde "o que isso me dá". Situação responde "quando eu vou
# usar". Quem compra material para criança decide na segunda: a tarde de
# chuva e a sala de espera são reconhecidas na hora, e benefício abstrato
# não é. Nenhum item promete resultado: todos descrevem um momento real.
useCases:
  title: Os momentos em que ele resolve a sua tarde
  intro: Não é material de ocasião especial. É o que fica guardado esperando a hora em que você precisa de uma atividade agora.
  items:
    - title: Dia de chuva
      icon: home
      text: O parque saiu dos planos e ainda faltam três horas para o jantar. Você imprime três folhas e a tarde muda de assunto.
    - title: Sábado de manhã
      icon: calendar
      text: Aquela hora em que a casa acorda devagar e a tela seria o caminho mais fácil. A mesa com lápis compete bem.
    - title: Tempo em família
      icon: spark
      text: Duas folhas, uma caixa de lápis e a conversa acontece sozinha, do lado da criança em vez de na frente dela.
    - title: Sala de espera
      icon: checklist
      text: Consulta, cartório, banco. Uma folha dobrada na bolsa resolve meia hora sem pedir tomada nem sinal.
    - title: Viagem de carro
      icon: compass
      text: A janela já perdeu a graça. Prancheta no colo, e o trecho passa mais rápido para todo mundo.
    - title: Casa da avó
      icon: home
      text: Chegou e não tem brinquedo daquela idade por lá. Você já levou a atividade impressa de casa.
    - title: Mais de uma criança
      icon: check
      text: Imprima o mesmo desenho duas vezes, ou um tema para cada uma. Ninguém precisa dividir a mesma folha.
    - title: Aquela uma hora sua
      icon: star
      text: Você precisa terminar uma coisa e precisa agora. Esta é a atividade que não exige você do lado.

