# ── Problema: a tarde que não passa ──────────────────────────
problem:
  title: A tarde não passa e a pergunta chega
  items:
    - Está chovendo, o parque saiu dos planos e ainda faltam três horas para o jantar.
    - A sala de espera do médico tem meia hora pela frente e nada para fazer.
    - O tablet está sem bateria, e a criança já descobriu isso.
    - Você precisa de quarenta minutos para terminar uma coisa, e precisa deles agora.
    - A viagem de carro é longa e a janela já perdeu a graça.
    - O convite da festa é hoje e falta um presente que ainda dê tempo.
  close: "Em todas essas horas a pergunta é a mesma: o que a gente faz agora? Ter 80 desenhos guardados no computador é ter essa resposta pronta antes de ela ser feita."

# ── Mecanismo: o que faz ser uma coleção ─────────────────────
method:
  title: Uma coleção de verdade, e não uma pasta de desenhos soltos
  name: Um traço só, oito temas
  intro: >-
    Baixar desenho avulso na internet todo mundo já fez. O que cansa é o
    resultado: um desenho de cada estilo, em qualidade diferente, sem ordem
    nenhuma. Aqui são três decisões que mudam isso.
  pillars:
    - title: O mesmo traço nas 80 páginas
      icon: pencil
      text: "Contorno preto uniforme, formas cheias, nada de detalhe minúsculo. A criança reconhece que é o mesmo mundo em todas as páginas, e é isso que faz parecer uma coleção."
    - title: Feito para a impressora de casa
      icon: printer
      text: "Fundo branco, sem área preta grande, sem sangria. Papel comum resolve, e papel um pouco mais grosso segura melhor a canetinha."
    - title: Área confortável para colorir
      icon: palette
      text: "Nenhuma região fechada menor que uma moeda no tamanho impresso. É o limite da mão de uma criança de cinco anos, e ele foi respeitado nas oitenta páginas."
  note: Tudo é arte original, desenhada para esta coleção. Não há personagem de desenho animado, franquia ou marca em nenhuma página.

# ── Benefícios: o que muda na sua casa ───────────────────────
benefits:
  title: O que você leva junto com os desenhos
  items:
    - title: Uma atividade sempre à mão
      icon: spark
      text: 80 desenhos guardados resolvem a tarde de chuva e a espera do médico sem nenhum planejamento.
    - title: Imprima quantas vezes quiser
      icon: printer
      text: O mesmo desenho serve para dois irmãos hoje e para a mesma criança de novo daqui a três meses.
    - title: Oito temas, não um só
      icon: palette
      text: Quem só quer dinossauro encontra dez, e ainda tem setenta para descobrir depois.
    - title: Dos 4 aos 8 anos
      icon: check
      text: Cada tema abre com páginas simples e termina com páginas mais cheias, então o material acompanha a criança.
    - title: Tudo original
      icon: star
      text: Arte feita para esta coleção, sem personagem de franquia e sem desenho copiado.
    - title: Chega na hora
      icon: checklist
      text: Acesso liberado após a aprovação do pagamento, e o arquivo é seu para baixar e guardar.

# ── Como funciona: quatro passos ─────────────────────────────
howItWorks:
  title: Do clique ao lápis na mão
  intro: Não tem nada para montar, recortar antes ou combinar. São quatro passos, e o terceiro é o único que exige você.
  steps:
    - title: Você compra
      text: Pagamento único, sem mensalidade e sem renovação. O acesso é liberado após a aprovação do pagamento.
    - title: Você baixa o arquivo
      text: Um PDF só, com as 80 páginas. Guarde no computador ou no celular, porque ele é seu.
    - title: Você escolhe e imprime
      text: Abra o índice, escolha o tema, imprima a página em A4 na opção tamanho real. Papel comum funciona.
    - title: A criança colore
      text: Entregue os lápis e pronto. Quando a folha acabar, imprima de novo, sem custo nenhum.

# ── Conteúdo: os oito temas ──────────────────────────────────
contents:
  title: Oito mundos para a criança escolher
  intro: São dez desenhos por tema, do mais simples ao mais cheio. Em qualquer tema que ela escolher, existem páginas do tamanho dela, e ainda sobram setenta para descobrir depois.
  countLabel: 10 desenhos
  modules:
    - number: 1
      title: Animais fofos
      icon: spark
      blurb: Os bichos que toda criança reconhece de longe, em traço redondo e cheio.
      objective: "Gatinho com o novelo, coelho com a cenoura, ursinho e o pote de mel, pinguim de cachecol, panda, raposinha dormindo, preguiça no galho, elefantinho na poça e a família de patinhos."
    - number: 2
      title: Dinossauros
      icon: star
      blurb: Do filhote saindo do ovo ao vale com vulcão, sem dente assustador em nenhum.
      objective: "Bebê saindo do ovo, tiranossauro sorridente, tricerátops, anquilossauro, estegossauro com borboletas nas placas, brontossauro alcançando as folhas altas, pterossauro planando e o vale com o vulcão ao fundo."
    - number: 3
      title: Fundo do mar
      icon: palette
      blurb: "O tema que mais rende cor: tudo curvo, tudo colorido, tudo conhecido."
      objective: "Peixinho entre bolhas, estrela-do-mar, caranguejo, cavalo-marinho, tartaruga, polvo acenando, golfinho saltando, água-viva, baleia com o esguicho e o passeio pelo recife."
    - number: 4
      title: Espaço
      icon: spark
      blurb: Aqui não existe cor certa, e é isso que deixa a criança livre para inventar.
      objective: "Foguete decolando, lua sorridente, planeta com anéis, alienígena simpático, astronauta flutuando, nave com janelinha, a bandeira na lua, cometa, a criança no telescópio e o sistema solar."
    - number: 5
      title: Veículos e aventuras
      icon: compass
      blurb: Rodas, asas e velas, com formas grandes e limpas para o giz de cera.
      objective: "Carrinho de corrida, balão de ar quente, bicicleta com cestinha, barco a vela, caminhão de bombeiros, avião entre as nuvens, trator, ônibus escolar, escavadeira e o trem da ponte."
    - number: 6
      title: Jardim e natureza
      icon: home
      blurb: Flor, bicho pequeno e horta, para a mão que gosta de detalhe delicado.
      objective: "Girassol, joaninha na folha, cogumelos, regador, borboleta na flor, abelhinha e a colmeia, passarinho no ninho, árvore com balanço, arco-íris e a horta."
    - number: 7
      title: Comidinhas divertidas
      icon: checklist
      blurb: Pizza, sorvete e cupcake sorridentes, campeões de pedido aqui em casa.
      objective: "Cupcake sorridente, sorvete de casquinha, rosquinha com cobertura, fatia de pizza, as frutinhas amigas, hambúrguer, chocolate quente, pipoca, bolo de aniversário e a mesa de piquenique."
    - number: 8
      title: Fantasia e personagens mágicos
      icon: star
      blurb: Unicórnio, fada, sereia e dragão, para quando a criança quer inventar história.
      objective: "Fadinha, poção mágica, coruja da noite, gnomo do jardim, unicórnio, dragãozinho, sereia na pedra, aprendiz de mago, castelo e o baú do tesouro."

# ── O que vem no arquivo ─────────────────────────────────────
# `mockup:` fica de fora enquanto as artes finais não existirem: não se
# inventa página do material.
materials:
  title: O que vem dentro do arquivo
  intro: Além das 80 páginas para colorir, o PDF traz o que transforma um monte de desenhos num material organizado.
  items:
    - title: 80 páginas para colorir
      icon: palette
      text: Uma arte por página, em A4, com fundo branco e contorno bem definido. Dez desenhos em cada um dos oito temas.
    - title: Este livro pertence a
      icon: pencil
      text: "A primeira página é da criança: o nome, um quadro para ela se desenhar e a data em que começou."
    - title: Índice por tema
      icon: list
      text: Para achar em segundos aquele dos dinossauros, sem rolar o arquivo inteiro.
    - title: Divisórias dos oito temas
      icon: star
      text: Uma folha de abertura por tema, com o nome em letra vazada para a criança colorir o próprio título.
    - title: Uma folha de instruções curta
      icon: printer
      text: Para você, não para a criança. Como imprimir em tamanho real, que papel usar e como aproveitar melhor o material.

