# ─────────────────────────────────────────────────────────────
#  Mundo de Colorir
#  Toda a copy da landing page vive neste arquivo.
#  Para alterar preço, checkout ou headline, edite apenas aqui.
#
#  FONTE: docs/mundo-de-colorir-source-of-truth.md e os três documentos
#  irmãos (producao, paginas, comercial). Se não está lá, não se afirma
#  aqui.
#
#  QUATRO COISAS QUE ESTA PÁGINA NUNCA PODE DIZER:
#
#  1. que colorir desenvolve coordenação motora, concentração, calma ou
#     qualquer outra coisa. É verdade conhecida sobre a atividade e vira
#     promessa do produto quando escrita numa página de venda. A BookGo
#     não vende desenvolvimento infantil;
#  2. que existe personagem conhecido, franquia ou desenho animado. Toda
#     a arte é original;
#  3. que chega alguma coisa em casa. É arquivo digital, e a reimpressão
#     sem custo depende justamente disso;
#  4. que chega alguma coisa em casa, de novo: material digital, e nada
#     é enviado pelo correio.
#
#  As cinco avaliações são reais e estão publicadas por corte. Ver o bloco
#  `reviews`, que registra o que saiu e por quê.
# ─────────────────────────────────────────────────────────────

slug: mundo-de-colorir
name: Mundo de Colorir

# Etapas do funil medidas nesta LP. Nenhuma é conversão.
funnelEventPrefix: mundo

# Terceira prateleira da home. Nasce com este material e cabe o que vier
# depois: atividade, jogo, material de imprimir para criança.
category:
  id: criancas-e-brincadeiras
  label: Crianças e brincadeiras

tagline: Uma coleção com 80 desenhos originais para imprimir e colorir, em 8 temas.
promise: Ter uma atividade pronta guardada para qualquer hora, com 80 desenhos originais em 8 temas, prontos para imprimir em casa quantas vezes quiser.

# ── Ambientação ──────────────────────────────────────────────
# Nuvem, estrelinha e rabisco de baixa opacidade ao fundo. O público desta
# página é pai e mãe escolhendo material para criança, e a régua estrutural
# continua a mesma das outras LPs.
ambience: playful

# ── Identidade visual ────────────────────────────────────────
# Nem o azul institucional, nem o sálvia do Casa Organizada, nem a páprica
# do Cardápio. Entra um azul-caneta alegre com acento manga, que é a dupla
# de lápis de cor mais reconhecível de um estojo infantil, sobre creme bem
# claro. Colorido sem virar festa: as cores fortes ficam no botão e nos
# destaques, e o corpo do texto segue em cinza-grafite.
#
# Contrastes conferidos: texto sobre fundo 14,2:1, branco sobre primary
# 5,1:1, branco sobre primaryDark 8,7:1, muted sobre fundo 5,4:1.
theme:
  primary: "#2E6BD6"       # azul-caneta, CTAs e destaques
  primaryDark: "#1E4AA0"   # azul profundo, hover e contraste
  accent: "#E0821F"        # manga, acento pontual
  background: "#FFFBF4"    # creme muito claro, fundo da página
  surface: "#FFFFFF"       # branco, cartões
  text: "#25292F"
  muted: "#5E6773"
  border: "#E8E2D6"

