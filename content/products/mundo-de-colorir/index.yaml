# ── Problema: a tarde que não passa ──────────────────────────
problem:
  title: A tarde não passa e a pergunta chega
  items:
    - Está chovendo, o parque saiu dos planos e faltam três horas para o jantar.
    - O tablet já rendeu o que tinha para render, e você quer outra coisa na mesa.
    - A sala de espera tem meia hora pela frente e nada para fazer.
    - Você precisa de quarenta minutos para terminar uma coisa, e precisa deles agora.
  close: "A mãe não precisa de centenas de atividades. Precisa de uma boa ideia pronta na hora em que a criança pergunta o que fazer agora."

# ── Como funciona: quatro passos ─────────────────────────────
howItWorks:
  title: Do clique ao lápis na mão
  intro: Quatro passos, e só o terceiro exige você.
  steps:
    - title: Compre
      text: Pagamento único. O acesso é liberado após a aprovação do pagamento.
    - title: Baixe
      text: Um PDF só, com as 80 páginas. Guarde no computador ou no celular.
    - title: Imprima
      text: Escolha o tema pelo índice e imprima em A4, na opção tamanho real.
    - title: Colora
      text: Entregue os lápis. Quando a folha acabar, imprima de novo.

# ── Conteúdo: os oito temas ──────────────────────────────────
contents:
  title: Oito mundos para a criança escolher
  intro: Dez desenhos por tema, do mais simples ao mais cheio.
  countLabel: 10 desenhos
  modules:
    - number: 1
      title: Animais fofos
      icon: spark
      blurb: Os bichos que toda criança reconhece de longe.
      objective: "Gatinho com o novelo, coelho, ursinho, pinguim, panda, raposinha, preguiça, elefantinho e a família de patinhos."
      thumbs:
        - paginas/gatinho.webp
        - paginas/personagens.webp
    - number: 2
      title: Dinossauros
      icon: star
      blurb: Do filhote saindo do ovo ao vale com vulcão ao fundo.
      objective: "Bebê saindo do ovo, tiranossauro sorridente, tricerátops, anquilossauro, estegossauro, brontossauro, pterossauro e o vale."
      thumbs:
        - paginas/dinossauro.webp
    - number: 3
      title: Fundo do mar
      icon: palette
      blurb: O tema que mais rende cor, e o que a criança pede de novo.
      objective: "Peixinho, estrela-do-mar, caranguejo, cavalo-marinho, tartaruga, polvo, golfinho, água-viva, baleia e o recife."
      thumbs:
        - paginas/peixinho.webp
        - paginas/sereia.webp
    - number: 4
      title: Espaço
      icon: spark
      blurb: Aqui não existe cor certa, e isso deixa a criança livre.
      objective: "Foguete, lua sorridente, planeta com anéis, alienígena, astronauta, nave, bandeira na lua, cometa e o sistema solar."
      thumbs:
        - paginas/foguete.webp
    - number: 5
      title: Veículos e aventuras
      icon: compass
      blurb: Rodas, asas e velas, em formas grandes para o giz de cera.
      objective: "Carrinho de corrida, balão, bicicleta, barco a vela, caminhão de bombeiros, avião, trator, ônibus, escavadeira e o trem."
    - number: 6
      title: Jardim e natureza
      icon: home
      blurb: Flor e bicho pequeno, para a mão que gosta de detalhe.
      objective: "Girassol, joaninha, cogumelos, regador, borboleta, abelhinha, passarinho no ninho, árvore com balanço, arco-íris e a horta."
    - number: 7
      title: Comidinhas divertidas
      icon: checklist
      blurb: Pizza, sorvete e cupcake sorridentes, campeões de pedido.
      objective: "Cupcake, sorvete, rosquinha, fatia de pizza, frutinhas, hambúrguer, chocolate quente, pipoca, bolo e o piquenique."
