# ── FAQ ──────────────────────────────────────────────────────
faq:
  title: Perguntas frequentes
  items:
    - q: Os 20 minutos são para cozinhar?
      a: "Não. Os 20 minutos são a sessão de planejamento da semana: olhar o que já tem em casa, escolher as refeições principais e montar a lista de compras. O preparo de cada refeição continua levando o tempo que leva."
    - q: Preciso planejar almoço e jantar todos os dias?
      a: Não necessariamente. O Planner permite organizar almoço e jantar, e você decide o quanto quer preencher. Em muitas semanas faz mais sentido planejar só os jantares, ou só alguns dias, e deixar o resto em aberto.
    - q: Minha semana muda muito. Ainda funciona?
      a: O cardápio é um conjunto de refeições para a semana, e não uma agenda com dia marcado. Trocar uma pela outra não derruba o plano, os dias corridos já entram marcados e a refeição de segurança existe para o dia que sai do previsto.
    - q: Eu quase não cozinho. Serve para mim?
      a: Serve se o que te incomoda é decidir o que comer, porque essa decisão existe mesmo em casas que cozinham pouco. Se você quase nunca prepara nada e não pretende mudar isso, o método vai ajudar menos, e é honesto dizer.
    - q: Já tentei montar cardápio antes e abandonei.
      a: Cardápio rígido de sete dias costuma ser abandonado porque assume uma semana que não acontece. Aqui você escolhe as refeições principais, marca antes os dias difíceis e pode trocar, repetir ou deixar dias em aberto sem que isso signifique ter falhado.
    - q: Posso repetir refeições?
      a: Pode, e o método chama isso de repetição planejada. Repetir porque facilita a rotina é diferente de repetir porque faltou ideia na hora.
    - q: E se eu pedir delivery?
      a: O delivery não invalida o planejamento. Ele pode inclusive entrar como a escolha de um dia corrido, decidida com antecedência em vez de no impulso do fim do dia.
    - q: Preciso seguir exatamente o que coloquei em cada dia?
      a: Não. O planejamento é referência, não obrigação. Ele existe para você não precisar decidir do zero, e não para cobrar disciplina.
    - q: É uma dieta?
      a: Não. Não existe restrição, contagem, cardápio prescrito nem orientação nutricional. O produto trata da decisão do que preparar, não do que você deve comer.
    - q: Tem receitas?
      a: Não é um livro de receitas. O método trabalha com as refeições que já fazem parte da sua rotina, e o Banco de Refeições da Casa existe justamente para reunir o que a sua casa já faz.
    - q: Como recebo os materiais?
      a: Após a aprovação do pagamento, o acesso é liberado na área de membros da Kiwify, plataforma responsável pelo checkout.

