# ── Problema: a cena das 18h ─────────────────────────────────
problem:
  title: São seis da tarde e a pergunta volta
  items:
    - Você abre a geladeira, olha, fecha. Um minuto depois abre de novo, como se algo tivesse mudado.
    - Tem comida ali. Só que falta alguma coisa para virar uma refeição, e o que resolveria está congelado.
    - Ontem já foi aquilo. Hoje ninguém quer repetir.
    - A fome aumenta enquanto a decisão não sai, e o que era escolha vira improviso.
    - No mercado você comprou o que lembrou, não o que ia preparar. Metade não conversa com a outra metade.
  close: O problema não é falta de capacidade na cozinha. É tentar tomar quatro ou cinco decisões seguidas no pior horário do dia, com fome e cansaço decidindo junto.

# ── Mecanismo: o Método dos 20 Minutos ───────────────────────
method:
  title: A decisão sai do fim do dia e vira um bloco só na semana
  name: O Método dos 20 Minutos
  intro: >-
    Em vez de decidir a refeição todo dia, você decide uma vez por semana, num
    horário em que ainda dá para pensar. São três blocos curtos, nesta ordem, e
    o relógio é de planejamento: nada aqui promete preparar comida em 20
    minutos.
  pillars:
    - title: Olhar, de 0 a 5 minutos
      icon: compass
      text: Uma passada rápida na geladeira, no freezer e na despensa para ver o que já existe. É o que impede de comprar o que já está em casa e de esquecer o que precisa sair antes.
    - title: Decidir, de 5 a 12 minutos
      icon: calendar
      text: "Você olha a agenda da semana, marca os dias em que cozinhar é pouco provável e escolhe as refeições. Não são sete dias perfeitos: são quatro ou cinco decisões tomadas com calma."
    - title: Listar, de 12 a 20 minutos
      icon: checklist
      text: O cardápio vira lista de compras, e a lista traz só o que está faltando de verdade, porque o inventário já disse o que você tem.
  note: Vinte minutos é o tempo do planejamento, uma vez por semana. O preparo de cada refeição continua levando o tempo que ele leva.

# ── Benefícios: transformação prática ────────────────────────
benefits:
  title: O que muda na rotina
  items:
    - title: Menos decisões no fim do dia
      icon: spark
      text: A pergunta "o que vamos comer hoje?" deixa de aparecer todo dia às seis da tarde, porque já foi respondida no domingo.
    - title: A lista nasce do cardápio
      icon: checklist
      text: Você para de comprar pelo que lembra no corredor do mercado e passa a comprar pelo que vai preparar.
    - title: Você sabe o que tem em casa
      icon: home
      text: O inventário rápido mostra o que já existe antes de a compra ser montada, e o que está no fundo do freezer volta a ser usado.
    - title: Os dias corridos entram na conta antes
      icon: calendar
      text: A semana é planejada sabendo quais dias não vão ter cozinha, em vez de descobrir isso às sete da noite.
    - title: Trocar fica fácil
      icon: list
      text: Como o cardápio é um conjunto de refeições e não uma agenda fixa, mudar um dia de lugar não derruba a semana inteira.
    - title: Sobras com destino
      icon: roadmap
      text: O que sobra passa a ser previsto, e não um pote que fica na geladeira até ninguém mais querer.

# ── Como funciona: planejar não é prever ─────────────────────
howItWorks:
  title: Planejar não é prever a semana perfeita
  intro: Se você já tentou fazer cardápio e abandonou, provavelmente o problema foi o formato, e não você.
  steps:
    - title: Escolha um dia e um horário
      text: Um bloco fixo por semana, antes da compra. Domingo à tarde, segunda de manhã, o que couber. O ponto é não decidir no fim do dia.
    - title: Marque os dias corridos primeiro
      text: Dia corrido é aquele que você já sabe de antemão que não vai ter cozinha. Ele entra no plano como é, e não como você gostaria que fosse.
    - title: Use refeições que a casa já conhece
      text: Refeição base é o que sua casa já gosta e você já sabe preparar. Repetir de propósito porque funciona é planejamento, não falta de ideia.
    - title: Deixe uma refeição de segurança
      text: Algo simples e sempre disponível para o dia em que a semana muda. É ela que evita que um imprevisto derrube o cardápio inteiro.

