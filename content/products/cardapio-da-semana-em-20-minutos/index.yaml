# ── Problema: a cena do fim do dia ───────────────────────────
problem:
  title: São seis da tarde e a pergunta volta
  items:
    - Você abre a geladeira, olha, fecha. Um minuto depois abre de novo, como se alguma coisa tivesse mudado.
    - Tem comida ali. Só que falta um ingrediente para virar refeição, e o que resolveria está congelado.
    - Ontem já foi aquilo, e hoje ninguém quer repetir.
    - A fome aumenta enquanto a decisão não sai. O delivery começa a parecer a opção mais fácil.
    - No mercado você comprou o que lembrou, não o que ia preparar, e metade não conversa com a outra metade.
    - Amanhã, no mesmo horário, a mesma pergunta volta.
  close: "O problema não é falta de capacidade na cozinha. É tentar tomar várias decisões seguidas justamente quando a energia para decidir já acabou."

# ── Mecanismo: o Método dos 20 Minutos ───────────────────────
method:
  title: A decisão sai do fim do dia e vira um bloco só na semana
  name: O Método dos 20 Minutos
  intro: >-
    Em vez de decidir a refeição todo dia, você decide uma vez por semana, num
    horário em que ainda dá para pensar. São três blocos curtos, nesta ordem.
  pillars:
    - title: Olhar, de 0 a 5 minutos
      icon: compass
      text: "Uma conferida rápida na geladeira, no freezer e na despensa. É o inventário que impede de comprar o que já está em casa e de esquecer o que precisa sair antes."
    - title: Decidir, de 5 a 12 minutos
      icon: calendar
      text: "Você olha a agenda, marca os dias corridos e escolhe as refeições principais a partir do que a semana realmente comporta. Não é montar uma semana perfeita."
    - title: Listar, de 12 a 20 minutos
      icon: checklist
      text: "O cardápio vira lista de compras, e a lista traz só o que está faltando de verdade, porque o inventário já disse o que você tem."
  note: Vinte minutos é o tempo do planejamento, uma vez por semana. O preparo de cada refeição continua levando o tempo que ela normalmente leva.

# ── Benefícios: o que muda na rotina ─────────────────────────
benefits:
  title: O que muda na rotina
  items:
    - title: Menos decisões no fim do dia
      icon: spark
      text: A pergunta deixa de aparecer todo dia às seis da tarde, porque já foi respondida uma vez, num momento mais tranquilo da semana.
    - title: A lista nasce do cardápio
      icon: checklist
      text: Você para de comprar pelo que lembra no corredor do mercado e passa a comprar pelo que pretende preparar.
    - title: Você sabe o que tem em casa
      icon: home
      text: O inventário rápido mostra o que já existe antes de a compra ser montada, e o que estava no fundo do freezer volta a ser usado.
    - title: Os dias corridos entram na conta antes
      icon: calendar
      text: A semana é planejada já sabendo quais dias vão ser difíceis, em vez de você descobrir isso às sete da noite.
    - title: Trocar deixa de ser problema
      icon: list
      text: Como o cardápio é um conjunto de refeições e não uma agenda fixa, mudar um dia de lugar não derruba a semana.
    - title: Menos improviso e uma saída para o imprevisto
      icon: roadmap
      text: Sobras passam a ter destino, e a refeição de segurança cobre o dia em que o plano muda.

# ── Como funciona: planejar não é prever ─────────────────────
howItWorks:
  title: Planejar não é prever a semana perfeita
  intro: Se você já tentou montar cardápio e abandonou, provavelmente o problema foi o formato, e não você. Este método não depende de sete dias perfeitos nem de seguir cada refeição à risca.
  steps:
    - title: Escolha um dia e um horário
      text: Um bloco fixo por semana, antes da compra. Domingo à tarde, segunda de manhã, o que couber na sua rotina. O ponto é não decidir com fome, no fim do dia.
    - title: Marque os dias corridos primeiro
      text: Dia corrido é aquele que você já sabe de antemão que vai ser difícil. Ele entra no plano como é, e pode inclusive ser o dia do delivery, decidido com antecedência em vez de no impulso.
    - title: Use refeições que a casa já conhece
      text: Refeição base é o que a sua casa já gosta e você já sabe preparar. Repetir de propósito porque facilita a rotina é planejamento, não falta de ideia.
    - title: Deixe uma refeição de segurança
      text: Algo simples e sempre disponível para quando a semana mudar. É ela que evita que um imprevisto derrube o cardápio inteiro.
    - title: Troque à vontade
      text: O cardápio diz o que existe para a semana, e você escolhe a ordem conforme os dias acontecem. Semana real diferente da semana planejada é o esperado, não uma falha.

# ── Conteúdo do produto ──────────────────────────────────────
contents:
  title: O que você vai aprender
  intro: Curso digital em texto. Cinco módulos objetivos, para ler e aplicar na mesma semana.
  modules:
    - number: 1
      title: Pare de decidir o jantar todos os dias
      objective: "O custo de decidir a refeição todo fim de dia, por que a compra sem destino e o cardápio rígido falham, e o que significa levar essas decisões do dia para a semana."
    - number: 2
      title: O Método dos 20 Minutos
      objective: "Os três blocos da sessão semanal na prática: o inventário rápido, a leitura da agenda com os dias corridos, a escolha das refeições no Planner e a lista que nasce daí. É aqui que você aplica o método pela primeira vez."
    - number: 3
      title: Monte seu cardápio sem complicar
      objective: "Montar a semana com o que a casa já gosta: banco de refeições, repetição planejada, ingredientes que se repetem entre pratos, preparações aproveitadas em outro momento, refeição de segurança e um jeito de testar novidade sem virar experimento."
    - number: 4
      title: Do cardápio para a lista de compras
      objective: "Fazer a lista nascer do cardápio: o que o inventário já cobre, o que precisa ser reposto, o que pode esperar, como organizar por categoria, o que fazer com promoção e como decidir entre uma compra só ou compras divididas."
    - number: 5
      title: Faça funcionar na vida real
      objective: "Quando a semana muda: trocar refeições, cobrir o dia em que falta um ingrediente ou alguém não come em casa, usar sobras, delivery e visitas sem derrubar o plano, e retomar depois de uma semana caótica."

