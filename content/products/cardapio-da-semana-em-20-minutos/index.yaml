# ── FAQ ──────────────────────────────────────────────────────
# CONFERIR: as perguntas são as objeções do briefing. As respostas foram
# escritas a partir dele e precisam bater com o conteúdo dos módulos.
faq:
  title: Perguntas frequentes
  items:
    - q: E os 20 minutos, são para cozinhar?
      a: "Não. Os 20 minutos são de planejamento, uma vez por semana: olhar o que tem em casa, decidir as refeições e montar a lista de compras. O preparo de cada refeição continua levando o tempo que leva."
    - q: Eu quase não cozinho. Serve para mim?
      a: Serve. O método organiza as decisões de refeição, e decidir o que vai para a mesa existe mesmo em casas que cozinham pouco. Dias corridos e refeições de segurança entram no plano justamente para isso.
    - q: Minha semana muda muito.
      a: O cardápio é um conjunto de refeições para a semana, e não uma agenda com dia marcado. Trocar uma pela outra não derruba o plano, e a refeição de segurança existe para o dia que sai do previsto.
    - q: Já tentei fazer cardápio e abandonei.
      a: Cardápio rígido de sete dias costuma ser abandonado porque assume uma semana que não acontece. Aqui você decide quatro ou cinco refeições, marca antes os dias em que não vai cozinhar e pode repetir de propósito o que funciona.
    - q: Eu moro sozinha. Vale a pena?
      a: Vale. Quem mora sozinho decide sozinho todos os dias, e costuma ser quem mais compra sem destino certo. O planner e a lista funcionam igual para uma pessoa, com porções menores e mais uso de sobras.
    - q: Minha família repete muita comida.
      a: "Repetição não é problema quando é escolhida. O método chama isso de repetição planejada: repetir o que a casa gosta porque funciona, e não porque faltou ideia na hora."
    - q: Eu peço delivery algumas vezes por semana.
      a: O método não promete acabar com isso. O delivery pode entrar no plano como a escolha de um dia corrido, decidida com antecedência em vez de no impulso do fim do dia.
    - q: Preciso seguir exatamente cada dia do cardápio?
      a: Não. O cardápio diz o que existe para a semana, e você escolhe a ordem conforme o dia acontece.
    - q: Como recebo os materiais?
      a: Após a aprovação do pagamento, o acesso é liberado na área de membros da Kiwify, plataforma responsável pelo checkout.

