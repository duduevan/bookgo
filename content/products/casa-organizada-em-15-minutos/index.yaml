testimonials:
  # CONVERSAS DE DEMONSTRAÇÃO, NÃO DEPOIMENTOS.
  #
  # `kind: demonstracao` é o que separa esta seção de prova social. As
  # perguntas abaixo são as objeções reais que este produto precisa
  # responder, e as respostas são da BookGo. Ninguém é nomeado e nada aqui
  # afirma resultado de cliente, porque nenhum cliente escreveu isto.
  #
  # A linguagem é de conversa de verdade de propósito: frase curta, bolha
  # quebrada, emoji, minúscula. Isso é tom, não é fingir pessoa. O que
  # continua proibido é a pergunta virar relato de resultado ("comecei e já
  # mudou"), porque aí deixaria de ser dúvida e viraria depoimento inventado.
  #
  # O schema impede a confusão nos dois sentidos: em `demonstracao` nenhum
  # item pode ter `name`, e em `depoimento` todo item precisa ter. Não é
  # convenção de quem escreve, é trava de build.
