# ── FAQ ──────────────────────────────────────────────────────
faq:
  title: Perguntas frequentes
  items:
    - q: Eu realmente não tenho tempo. Isso funciona para mim?
      a: O método foi pensado exatamente para quem não tem blocos livres de tempo. A proposta é usar janelas de 15 minutos dentro da rotina que você já tem, em vez de esperar por um dia inteiro disponível.
    - q: Funciona com criança em casa?
      a: A casa continua sendo usada, e o método parte disso. Em vez de tentar deixar tudo pronto de uma vez, ele trabalha com manutenção curta e frequente, que é o que costuma sustentar a organização quando a casa é habitada o dia todo.
    - q: Já tentei me organizar antes e não consegui manter.
      a: Métodos que exigem muito tempo de uma vez tendem a ser abandonados. Aqui o compromisso diário é pequeno de propósito, e existe um checklist indicando o que fazer, para você não depender de motivação.
    - q: Minha família não ajuda. Ainda assim vale?
      a: O método é escrito para ser aplicado por uma pessoa. O Módulo 5 trata de pontos de acúmulo e hábitos simples que reduzem a bagunça recorrente, mesmo quando a colaboração da casa é limitada.
    - q: Preciso assistir a aulas?
      a: Não. O conteúdo é em texto e em materiais práticos em PDF, feitos para leitura rápida e aplicação direta.
    - q: É mais um planner que eu vou abandonar?
      a: O Planner Semanal é uma peça de apoio, não o centro do método. Ele é simples e pode ser usado impresso ou no celular — e, se você parar de usá-lo, o método continua funcionando.
    - q: Preciso comprar caixas ou organizadores?
      a: Não. O método trabalha com o que você já tem em casa.
    - q: Como recebo os materiais?
      a: Após a confirmação do pagamento, o acesso é liberado pela Kiwify, plataforma responsável pelo checkout.

