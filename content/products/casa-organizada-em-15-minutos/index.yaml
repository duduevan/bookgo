  items:
    - Quem tem rotina corrida e quase nunca consegue blocos livres de tempo.
    - Quem sente que arruma a casa e ela desarruma pouco tempo depois.
    - Quem quer uma organização possível, e não uma casa de revista.
    - Quem já tentou planners detalhados e não conseguiu manter.
    - Quem divide a casa com outras pessoas, inclusive crianças, e precisa de um método que aguente o uso diário.

notForWho:
