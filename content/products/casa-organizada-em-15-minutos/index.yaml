# ── Garantia ─────────────────────────────────────────────────
# Prova social — desligada.
#
# Não existe depoimento real autorizado até aqui, e depoimento não se
# inventa. Com `enabled: false` a seção não é renderizada: a LP não ganha
# título, espaço vazio nem CSS por causa deste bloco.
#
# Para ligar: colete aqui só texto que uma pessoa real escreveu e autorizou
# a publicar, e vire `enabled` para true. Formatos disponíveis por item:
# `type: card` (texto corrido) e `type: phone` (conversa).
testimonials:
  # `demo: true` renderiza a seção com uma tarja visível dizendo que é
  # exemplo de layout. Serve para avaliar o desenho antes de existirem
  # depoimentos reais — e a tarja garante que publicar por engano fique
  # óbvio na própria página, não só num comentário no código.
  #
  # Para publicar de verdade: troque os textos por mensagens que uma pessoa
  # real escreveu e autorizou, apague `demo` e mantenha `enabled: true`.
  # Sem `demo`, o build exige itens reais.
  enabled: true
  demo: true
  title: Como as conversas aparecem
  intro: Estrutura pronta para receber depoimentos reais. Os textos abaixo são exemplo de layout.
  items:
    - type: phone
      name: Nome de quem escreveu
      status: substituir por depoimento real
      messages:
        - side: incoming
          text: Texto de exemplo, no comprimento de uma mensagem real, para conferir como a bolha se comporta em duas ou três linhas.
          time: "09:12"
        - side: outgoing
          text: Resposta de exemplo, alinhada à direita, com horário e confirmação de leitura.
          time: "09:14"
          read: true
        - side: incoming
          text: Terceira mensagem, mais curta.
          time: "09:15"
    - type: phone
      name: Nome de quem escreveu
      status: substituir por depoimento real
      messages:
        - side: incoming
          text: Segunda tela de exemplo, para ver como duas conversas se comportam lado a lado no desktop.
          time: "18:40"
        - side: outgoing
          text: Resposta curta.
          time: "18:41"
          read: true

