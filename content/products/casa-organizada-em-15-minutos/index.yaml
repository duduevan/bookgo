# ── Problema ─────────────────────────────────────────────────
problem:
  title: Você organiza, e pouco tempo depois parece que ninguém organizou nada
  items:
    - Você arruma a cozinha à noite e, no dia seguinte, ela já está do mesmo jeito.
    - A organização vira assunto de sábado, e o fim de semana desaparece.
    - Você olha para a bagunça, não sabe por onde começar e acaba adiando.
    - Quando um ambiente finalmente fica pronto, outro já desandou.
    - Os métodos que você encontra pedem dias inteiros, caixas novas e uma casa vazia.
    - Planners detalhados funcionam por uma semana e depois são abandonados.
  close: O problema quase nunca é falta de esforço. É que organizar tudo de uma vez não foi feito para uma rotina que não para.

# ── Mecanismo ────────────────────────────────────────────────
method:
  title: Existe um caminho mais simples
  name: O Método dos 15 Minutos
  intro: >-
    Em vez de esperar por um dia livre que dificilmente chega, você organiza em sessões
    curtas de 15 minutos distribuídas na sua rotina. Uma sessão não organiza a casa inteira,
    e não precisa organizar. O que mantém a casa em ordem é a repetição dessas janelas curtas.
  pillars:
    - title: Um ponto de cada vez
      icon: compass
      text: Você escolhe um alvo específico para a sessão (a bancada, uma gaveta, o sofá) em vez de encarar o cômodo inteiro.
    - title: Prioridade antes de perfeição
      icon: list
      text: Primeiro o que mais atrapalha o dia a dia. O detalhe fica para quando houver tempo extra.
    - title: Manutenção no lugar de mutirão
      icon: calendar
      text: Pequenas sessões frequentes evitam o acúmulo que transforma organização em um projeto de fim de semana.
    - title: Encaixe na rotina real
      icon: home
      text: Os 15 minutos entram em brechas que já existem no seu dia, sem exigir que você reorganize a agenda.
  note: O método não promete uma casa de revista nem resolve tudo em uma única sessão. Ele propõe uma forma de organização que cabe em dias corridos.

# ── Benefícios ───────────────────────────────────────────────
benefits:
  title: O que muda na prática
  items:
    - title: Começar deixa de ser o problema
      icon: spark
      text: Quinze minutos é um compromisso pequeno o suficiente para caber em quase qualquer dia, e isso reduz a paralisia de não saber por onde começar.
    - title: O fim de semana volta a ser seu
      icon: calendar
      text: Quando a manutenção acontece durante a semana, o sábado deixa de ser o dia de correr atrás do prejuízo.
    - title: Menos decisão, mais execução
      icon: list
      text: Com o que fazer já definido em checklist, sua energia vai para a ação em vez de ir para o planejamento.
    - title: Sensação de controle
      icon: compass
      text: Ver um ponto resolvido por dia muda a relação com a casa, mesmo quando ela ainda não está do jeito ideal.
    - title: Pensado para casa habitada
      icon: home
      text: O método parte do princípio de que a casa é usada todos os dias, inclusive por crianças, e não espera que ela fique intocada.

# ── Como funciona ────────────────────────────────────────────
howItWorks:
  title: Como funciona no seu dia
  steps:
    - title: Escolha a sua janela
      text: Defina onde os 15 minutos cabem. Pode ser antes do banho, depois do jantar ou enquanto o café passa.
    - title: Siga o checklist do dia
      text: O Checklist Diário indica o alvo da sessão, para você não gastar a janela decidindo o que fazer.
    - title: Pare quando o tempo acabar
      text: Terminaram os 15 minutos, você para. Esticar a sessão é justamente o que transforma organização em cansaço.
    - title: Repita e ajuste
      text: Com o Planner Semanal você distribui as sessões ao longo da semana e adapta conforme a rotina muda.

# ── Conteúdo do produto ──────────────────────────────────────
contents:
  title: O que você vai aprender
  intro: Curso digital em texto. Cinco módulos objetivos, para ler e aplicar no mesmo dia.
  modules:
    - number: 1
      title: Pare de tentar organizar tudo
      objective: Entender por que grandes mutirões de organização geram cansaço e não resolvem o problema da manutenção.
    - number: 2
      title: O Método dos 15 Minutos
      objective: Aprender a escolher prioridades e a trabalhar em pequenas janelas de organização.
    - number: 3
      title: Organizando ambiente por ambiente
      objective: Aplicar o método na cozinha, na sala, nos quartos, no banheiro e na área de serviço.
    - number: 4
      title: Sua rotina semanal
      objective: Definir o que fazer diariamente, semanalmente e quando houver tempo extra.
    - number: 5
      title: Como evitar que a bagunça volte
      objective: Criar hábitos simples de manutenção, identificar pontos de acúmulo e devolver rapidamente os objetos ao lugar.

# ── Materiais incluídos ──────────────────────────────────────
