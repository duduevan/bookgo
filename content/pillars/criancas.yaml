name: Crianças
headline: Desenhos e brincadeiras para os dias em casa
description: Atividades simples de preparar, desenhos para imprimir e ideias para as horas em que a criança quer fazer alguma coisa.
intro:
  - "Aqui ficam os conteúdos sobre entreter criança em casa sem produção: o que dá para preparar em cinco minutos, o que funciona num dia de chuva e o que render uma tarde inteira com o que já existe na gaveta."
  - Os assuntos se dividem em dois. Desenhos para colorir trata de imprimir e escolher desenho por tema e por idade; Atividades em casa trata das ideias para quando a pergunta é o que a gente faz agora.
seo:
  title: Crianças
  description: Desenhos para imprimir e colorir e atividades simples para fazer com crianças em casa.
order: 20
